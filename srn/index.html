<textarea id="s" readonly>INT. STAFF ROOM - DAY

Thirty exam scripts sit in a pile on the table, still in their plastic wallets. MARGARET (58), head of film, pours a coffee she will not drink and looks at the pile the way you look at weather.

MARGARET
Who taught them to put the dialogue in the middle of the page?

DEV (24), teaching assistant, first term, stands in the doorway with his coat still on. He looks at his shoes, then at the pile, then back at his shoes.

DEV
I did. I mean, the software did.

MARGARET
Then the software marks them.

She pushes the pile across the table towards him. It stops exactly where he can reach it, which is worse than if it had fallen.

CUT TO:</textarea>
<textarea id="l" readonly>INT. UNIVERSITY CORRIDOR - NIGHT

A corridor of closed doors. Strip lights buzz. One door is open, throwing a rectangle of light onto the floor.

NORA MBEKI (41), coat still on, walks the corridor reading from a phone. She stops at the open door.

INT. SEMINAR ROOM 306 - CONTINUOUS

A long table, twenty chairs, one occupied. TOBIAS FENN (63) sits at the far end with a stack of paper in front of him and a red pen he is not using.

NORA
They told me you&#x27;d gone home.

TOBIAS
They tell everyone that. It saves conversation.

He does not look up. Nora comes in, puts her bag on a chair, does not sit.

NORA
The building closes at ten.

TOBIAS
The building has been closing at ten for thirty-one years. I have never once been in it at ten.

NORA
It&#x27;s twenty past.

Now he looks up.

TOBIAS
(mildly)
Then we are both criminals.

Nora sits. Between them, the stack of paper. She reads the top page upside down.

NORA
Is that the Kramer thesis?

TOBIAS
It is forty scripts by nineteen-year-olds, and they are all the same script.

NORA
They can&#x27;t all be the same script.

TOBIAS
A young man returns to the village where his father died. It rains. There is a dog. The dog survives.

NORA
(beat)
That&#x27;s a good film.

TOBIAS
It is forty good films.

He finally uncaps the red pen, looks at it, caps it again.

CUT TO:

INT. SEMINAR ROOM 306 - LATER

The stack has moved to the middle of the table. Two mugs now. The window is black.

NORA
Can I ask you something you won&#x27;t like?

TOBIAS
You may ask. I reserve the right to enjoy it.

NORA
Why do you still mark them on paper?

A long pause. Tobias turns a page over, smooths it with his palm.

TOBIAS
Because on paper I can see how long they held a shot.

NORA
You can see that on a screen.

TOBIAS
I can see the number on a screen. On paper I can feel the weight of it in my hand. Two pages of silence is heavy. Two pages of talking is light. The screen makes them the same.

NORA
That&#x27;s not true and you know it.

TOBIAS
(cheerfully)
It is entirely not true. I am sixty-three and I like paper.

Nora laughs, once, and it surprises her.

INT. SEMINAR ROOM 306 - LATER

Nora has taken off her coat. She is reading a script from the middle of the stack. Tobias watches her read.

NORA
This one&#x27;s different.

TOBIAS
Page?

NORA
Page four. She doesn&#x27;t answer the phone.

TOBIAS
Ah. Yes. That one.

NORA
The whole scene is her not answering the phone.

TOBIAS
Two and a half pages of it.

NORA
(reading)
&quot;She lets it ring. She lets it ring. She lets it ring.&quot;

TOBIAS
Three times. He wrote it three times. I nearly crossed out two of them.

NORA
Why didn&#x27;t you?

TOBIAS
Because the third one is the one that hurts.

Nora puts the script down. Something in the room has changed.

NORA
Who is he?

TOBIAS
First year. Sits at the back. Has never once spoken.

NORA
Does he know it&#x27;s good?

TOBIAS
Nobody has told him.

DISSOLVE TO:

EXT. CAMPUS - NIGHT

The two of them cross an empty car park. Sodium lights. A fox stops, considers them, moves on.

NORA
I have a meeting tomorrow about the software.

TOBIAS
The software.

NORA
The licences. Forty thousand a year and it doesn&#x27;t run on the machines the students actually own.

TOBIAS
So buy different machines.

NORA
With what?

TOBIAS
(not unkindly)
This is the part of the conversation where I am useless.

NORA
You&#x27;re not useless. You&#x27;re just on paper.

INT. NORA&#x27;S CAR - NIGHT

Rain begins. Nora does not start the engine. Tobias sits in the passenger seat with his seatbelt already on, patient as a schoolboy.

NORA
Can I tell you what I actually want?

TOBIAS
Please.

NORA
I want to see the writing happen. Not the final file. The mess. The version where she answers the phone, and the version where she doesn&#x27;t, and the three minutes between them.

TOBIAS
That is not a piece of software. That is a person paying attention.

NORA
It could be both.

Tobias considers this. The rain gets heavier.

TOBIAS
When I was your age I marked a script by a girl who wrote the same scene eleven times. Eleven. I gave her a two-one and told her to make up her mind.

NORA
And?

TOBIAS
She stopped writing.

Silence. The wipers are off. The windscreen blurs completely.

TOBIAS (CONT&#x27;D)
So no. I do not think it is only a person paying attention. I think the person gets tired, and the person is wrong, and the person is me.

CUT TO:

EXT. HEADINGTON HILL - NIGHT

Nora&#x27;s car climbs the hill, tail lights in the rain.

INT. NORA&#x27;S CAR - CONTINUOUS

TOBIAS
Left at the lights. There is no need to take me to the door.

NORA
I&#x27;m taking you to the door.

TOBIAS
There is no need.

NORA
There is rain.

He accepts this.

EXT. TOBIAS&#x27;S HOUSE - NIGHT

A narrow terrace. The car stops. Neither of them moves.

TOBIAS
The boy at the back.

NORA
Yes.

TOBIAS
Tell him it&#x27;s good. Not from me. From you. It counts for more from someone he does not have to believe.

NORA
He&#x27;ll ask what was good about it.

TOBIAS
Then tell him: the third time she lets it ring.

He gets out. Shuts the door. Leans down to the window, which she lowers.

TOBIAS (CONT&#x27;D)
Nora.

NORA
Yes.

TOBIAS
Buy the machines the students own.

He goes in. The light in the front room comes on, then off again.

INT. SEMINAR ROOM 306 - MORNING

Sun through dirty glass. The table is empty except for one script, squared up, a yellow sticky note on the cover.

Insert: the note, in a hard old-fashioned hand. &quot;PAGE 4. DO IT AGAIN.&quot;

A door opens. ADAM CHEUNG (19), hood up, comes in for a chair and stops when he sees the script with his name on it. He looks at the door, as if the person who left it might still be in the corridor.

He reads the note. He reads it again. He sits down, in the wrong chair, at the wrong end of the table, and opens a laptop with a cracked corner.

The screen wakes. A dialogue box is already waiting for him: LICENCE EXPIRED. CONTACT YOUR ADMINISTRATOR.

ADAM
(to nobody)
Yeah.

He closes the laptop, opens his bag, takes out a pen and the back of a printed timetable, and starts writing on that instead.

INT. FINANCE MEETING ROOM - DAY

A room with no windows and too many chairs. A projector fan whirs. NORA sits on one side of a long table. Opposite her, PRIYA SHAH (45), director of operations, and a laptop turned so nobody can see the screen.

PRIYA
Forty-one thousand.

NORA
For a hundred licences.

PRIYA
For a hundred licences, renewed in February, which is the middle of the year, which is nobody&#x27;s idea.

NORA
It was somebody&#x27;s idea in 2009.

PRIYA
Everything was somebody&#x27;s idea in 2009.

She turns the laptop a few degrees. Nora leans in, reads, sits back.

NORA
Can I ask what the licence actually buys us?

PRIYA
Software.

NORA
On which machines?

Priya does not answer. Nora takes out a phone, puts it on the table face up, does not touch it.

NORA (CONT&#x27;D)
I did a count last week. Sixty-one of our students have a laptop that can run it. The other hundred and twelve have a phone, a Chromebook, or a machine their brother used before them.

PRIYA
So they use the lab.

NORA
The lab has twenty seats and closes at six.

PRIYA
Then they book the lab.

NORA
They write at two in the morning, Priya. That is when people write. That is when I wrote.

A long silence. The projector fan gets louder, or seems to.

PRIYA
What are you asking me for?

NORA
I am asking you to let me spend it differently.

PRIYA
On what?

NORA
I do not know yet. That is the honest answer and I know it is a bad one.

Priya closes the laptop. The click is very final.

PRIYA
Come back in February with a number.

EXT. CAMPUS QUAD - DAY

Grey light. Students cross in coats. Nora walks fast, phone at her ear, saying nothing, listening.

She passes a bench where ADAM sits writing on the back of the timetable, hood up, oblivious. She does not see him. He does not see her.

INT. LECTURE THEATRE - DAY

Raked seats, half full. TOBIAS stands at the front with no slides, no laptop, one piece of chalk.

TOBIAS
A scene is a negotiation in which one person wants something and the other one has it. Everything else is weather.

He writes two words on the board: WANT and HAVE.

TOBIAS (CONT&#x27;D)
If you cannot tell me who wants and who has, you have not written a scene. You have written weather.

A STUDENT raises a hand.

STUDENT
What if they both want something?

TOBIAS
Then one of them is lying, and that is the best kind of scene there is.

Laughter. Tobias does not smile. He looks along the rows and finds the back, where ADAM sits with the hood down for once.

TOBIAS (CONT&#x27;D)
Page four. Somebody in this room wrote two and a half pages of a woman not answering a telephone.

Adam goes very still.

TOBIAS (CONT&#x27;D)
It is the only thing I have read this year that I could not have written myself. That is my definition of talent, and it is the only one I have.

He turns back to the board. Nobody turns round to look at Adam, and that is the kindest thing this room has ever done.

INT. UNIVERSITY CORRIDOR - DAY

Adam comes out of the lecture into the corridor and keeps walking, faster than necessary, past the toilets, past the lifts, until he is outside.

EXT. FIRE ESCAPE - CONTINUOUS

He sits on a metal step and gets his breath. He takes out the timetable, unfolds it, reads what he has written, and for the first time we see his face when he likes something he made.

INT. NORA&#x27;S OFFICE - DAY

A small office overflowing with paper. Nora eats lunch standing up. A knock.

NORA
It&#x27;s open.

TOBIAS comes in with two mugs and no explanation.

TOBIAS
You said you had a meeting about the software.

NORA
I had a meeting about the software.

TOBIAS
And?

NORA
Come back in February with a number.

Tobias puts a mug down in front of her, on top of the paper, which is exactly the wrong place and she does not mind.

TOBIAS
When I started here we had one photocopier and a rule that scripts had to be delivered in person. Nobody was ever late, because everybody had to look at me.

NORA
That&#x27;s not a system, that&#x27;s intimidation.

TOBIAS
It is a system with a face. The new one has no face. When it fails, nobody is embarrassed.

NORA
Somebody is embarrassed. The student is embarrassed.

Tobias accepts this with a small nod, which from him is an argument lost.

TOBIAS
Then your number, in February, should buy the student&#x27;s embarrassment back.

INT. COMPUTER LAB - EVENING

Twenty machines, six students, a window going dark. ADAM waits behind a boy who is clearly not going to finish.

A TECHNICIAN (30s) does the rounds with a trolley.

ADAM
Sorry, is there a way to get the writing program on my own laptop?

TECHNICIAN
What have you got?

ADAM
It&#x27;s an old MacBook. Twenty-seventeen, maybe.

TECHNICIAN
Then no.

ADAM
Right.

TECHNICIAN
You can use the lab.

ADAM
The lab closes at six.

TECHNICIAN
(not unkindly)
Everything closes at six.

He moves on with the trolley. Adam looks at the clock. Five to six.

He opens his own laptop anyway, opens a blank document in a browser, and starts typing his scene from the timetable, one finger at a time, in the wrong font, with no margins, because that is what he has.

INT. PUB - NIGHT

A back room with a low ceiling. Six students around two tables pushed together, pints, printouts. ADAM is at the end with his timetable pages. LEILA (21), sharp, generous, runs the room without anybody electing her.

LEILA
Right. Whose is the one with the dog?

Three hands go up. Laughter.

LEILA (CONT&#x27;D)
Every year. Every single year.

STUDENT TWO
It&#x27;s a good dog.

LEILA
It&#x27;s forty good dogs.

She turns to Adam, who has been trying to become furniture.

LEILA (CONT&#x27;D)
You read nothing last term.

ADAM
I wasn&#x27;t finished.

LEILA
Nobody&#x27;s finished. That&#x27;s not what this is.

She holds out a hand. After a moment he gives her the pages. She reads, in the noise, with a pint in her other hand, and the table goes quiet the way tables do when one person stops performing.

LEILA (CONT&#x27;D)
Who is she?

ADAM
My mum. Not really. A bit.

LEILA
Does she answer it in the end?

ADAM
No.

LEILA
Good.

She gives the pages back, and the noise comes up again, and Adam sits there holding them with both hands.

INT. NORA&#x27;S OFFICE - DAY

Nora on the phone, notepad in front of her, writing numbers and crossing them out.

NORA
(into phone)
No, I understand it&#x27;s per seat. I&#x27;m asking what happens to the seat when the student graduates.

She listens.

NORA (CONT&#x27;D)
So we buy it again.

She listens.

NORA (CONT&#x27;D)
Every year. For the same seat. For a different person.

She writes one word on the pad and underlines it twice. We see it: RENT.

INT. TOBIAS&#x27;S HOUSE - EVENING

Books to the ceiling, a dead fireplace, one lamp. TOBIAS eats supper from a tray in front of a paused film.

The doorbell. He does not hurry.

INT. TOBIAS&#x27;S HOUSE - HALLWAY - CONTINUOUS

He opens the door. NORA, wet, holding a folder.

TOBIAS
This is a house, not an office.

NORA
I know.

TOBIAS
People do not come to houses.

NORA
I know. May I come in?

He stands aside.

INT. TOBIAS&#x27;S HOUSE - LIVING ROOM - LATER

The folder is open on the low table. Tobias reads with his glasses pushed up onto his forehead, which does not help and which he does every time.

TOBIAS
You want to give it away.

NORA
I want to buy the thing the students already own. A browser. A document. Whatever laptop their brother handed down. The format lives in the document instead of in a program.

TOBIAS
And the money?

NORA
A tenth of it. The rest goes to people.

TOBIAS
Which people?

NORA
Two graduate readers, paid, who mark formatting so that the staff mark stories.

Tobias puts the folder down. This is the first time in the film he has looked at her with something like alarm.

TOBIAS
You are going to take the worst part of my job away from me.

NORA
Yes.

TOBIAS
I have complained about it for thirty-one years.

NORA
I know.

TOBIAS
(beat)
It is possible that I enjoyed complaining.

NORA
I know that too.

He laughs, once, from somewhere old.

INT. LIBRARY - DAY

Long tables, green lamps. ADAM works at the end of one, laptop open, the browser document on screen. Beside him, LEILA is reading a printed script with a pencil.

LEILA
Your scene headings are all over the place.

ADAM
I know.

LEILA
And your character names keep changing size.

ADAM
I know. I type them and it does what it wants.

LEILA
So fix it.

ADAM
It takes an hour. Every time. An hour of tabs.

Leila stops, pencil in the air.

LEILA
An hour?

ADAM
Maybe two if there&#x27;s a lot of dialogue.

LEILA
So every draft costs you two hours before you&#x27;ve changed a word.

Adam shrugs, as if this is weather. Leila looks at him for a long moment, then writes something on the corner of her own page and does not explain it.

INT. SEMINAR ROOM 306 - DAY

Tobias teaching. The chairs in rows today. He holds a script at arm&#x27;s length, not looking at it.

TOBIAS
In 1994 a woman in this department wrote a scene eleven times. The same scene. Eleven.

He puts the script down.

TOBIAS (CONT&#x27;D)
I told her to make up her mind. I gave her sixty-two and a sentence I have remembered ever since, which is a thing I do not recommend.

A STUDENT
What happened to her?

TOBIAS
She became extremely good at something else.

He lets that sit.

TOBIAS (CONT&#x27;D)
Eleven versions is not indecision. Eleven versions is a person finding out what she thinks. I could not see it because I could only see the eleven pieces of paper on my desk at midnight, and I was tired, and the paper looked like failure.

He picks the script back up.

TOBIAS (CONT&#x27;D)
So. When you are given a bad mark, consider the possibility that the man who gave it to you was simply holding too much paper.

EXT. CAR PARK - NIGHT

Rain on car roofs. NORA finds PRIYA unlocking a car.

NORA
Priya.

PRIYA
It&#x27;s February in six weeks, Nora.

NORA
I have the number.

PRIYA
(opening the door)
Then put it in an email like a normal person.

NORA
Four thousand two hundred.

Priya stops with her hand on the door.

PRIYA
Out of forty-one.

NORA
Out of forty-one.

PRIYA
What&#x27;s the catch?

NORA
The catch is that it is not a licence, so there is nothing to renew in February, so nobody in this university will have a job that consists of renewing it.

Priya takes this in. She closes the car door without getting in.

PRIYA
You have made an enemy.

NORA
I have made several. Do you want the number or not?

Priya holds out her hand for the folder, in the rain, which is the closest thing to a yes this institution produces.

INT. COMPUTER LAB - NIGHT

Empty machines, lights on a timer. ADAM is the only one left, and he is not using a machine. He is on the floor against the wall with his old laptop on his knees.

The lights go out on their timer. He keeps typing, lit by the screen.

INT. SEMINAR ROOM 306 - DAY

A small group. LEILA stands at the front with a laptop plugged into the projector. On the wall behind her, a document, unformatted, ugly.

LEILA
This is Adam&#x27;s scene. This is what it looks like when he writes it.

She presses a key. The document reorders itself on the wall: scene heading, action, character, dialogue, in their right places, in a second.

Somebody in the room says something unrepeatable. Laughter.

LEILA (CONT&#x27;D)
Two hours. That&#x27;s what that was worth. Two hours a draft, for every one of us, for three years.

A STUDENT
Where did you get it?

LEILA
A man made it because he got tired. It&#x27;s twelve pounds.

She shrugs, which is the most devastating thing she could do.

LEILA (CONT&#x27;D)
That&#x27;s it. That&#x27;s the whole talk.

INT. NORA&#x27;S OFFICE - DAY

Nora at her desk. A knock, and LEILA leans in without waiting.

LEILA
Are you the one doing the software thing?

NORA
Depends who&#x27;s asking.

LEILA
Because if the department buys anything, buy something that runs on a phone.

NORA
Why a phone?

LEILA
Because that&#x27;s where we write when we&#x27;re on the bus, and the bus is forty minutes, twice a day, five days a week.

Nora picks up a pen. She writes it down. She does not pretend she already knew.

NORA
Tell me the rest.

LEILA
(coming in properly)
Have you got an hour?

EXT. HEADINGTON HILL - EVENING

The hill in low sun for once. Adam walks up it with his bag, earphones in. A bus passes him, then stops, and LEILA leans out of the window to shout something we do not hear.

He laughs and waves her off. The bus goes. He keeps walking.

INT. TOBIAS&#x27;S HOUSE - LIVING ROOM - NIGHT

Boxes. Half the books are down from the shelves. Tobias sits among them with a glass of something, doing nothing at all.

He picks a book at random, opens it, finds a folded piece of paper inside, and reads it with no expression whatsoever. He puts it in his pocket rather than back in the book.

INT. UNIVERSITY CORRIDOR - DAY

Nora walks with an armful of folders. She passes room 306, stops, comes back.

INT. SEMINAR ROOM 306 - CONTINUOUS

The room is being repainted. Dust sheets, a ladder, the table gone. A DECORATOR whistles badly.

NORA
Sorry, is this permanent?

DECORATOR
It&#x27;s paint.

NORA
No, I mean the room. Is it still a teaching room?

DECORATOR
(shrugging)
They don&#x27;t tell me. I get a colour and a date.

Nora looks at the bare walls for a moment, at the rectangle of clean paint where a notice board was.

NORA
It was a good room.

DECORATOR
It&#x27;ll be a good room in beige.

INT. TRAIN - NIGHT

A late service, half empty, strip lights. ADAM has a table seat to himself, laptop open, the document in the browser.

Opposite him a WOMAN (60s) reads a paperback. She looks at his screen the way people do, without meaning to.

WOMAN
Is that a play?

ADAM
A film. Sort of.

WOMAN
Sort of.

ADAM
It&#x27;s for a course.

WOMAN
(returning to her book)
That&#x27;s a shame.

Adam looks at her. She does not look up.

ADAM
Why?

WOMAN
Because you&#x27;ve been typing since Reading and you haven&#x27;t looked out of the window once, and people who do that aren&#x27;t doing it for a course.

She turns a page. Adam looks at his screen, then out of the window, at nothing, at the dark and the reflection of his own face and the small bright rectangle of the page.

He looks back down and keeps typing.

INT. NORA&#x27;S KITCHEN - NIGHT

Nora and a laptop and the spreadsheet that has become a different spreadsheet. Her phone buzzes. A message from an unknown number.

Insert: the phone. &quot;Hi. Leila gave me your number. Is it true the department might stop paying for the software? Because some of us have been paying for it ourselves. A&quot;

Nora reads it twice. She puts the phone down. She picks it up again.

Insert: her reply, typed slowly. &quot;How many of you?&quot;

A pause. Three dots.

Insert: &quot;Eleven that I know of. Probably more. Nobody talks about it.&quot;

Nora sits back. Outside, a car goes past, and its lights cross the ceiling.

INT. FINANCE MEETING ROOM - DAY

The same windowless room. PRIYA, NORA, and a MAN FROM IT (50s) with a laptop and the expression of somebody who has been in this room many times.

MAN FROM IT
The issue is support.

NORA
Support for what?

MAN FROM IT
If it breaks, who do they call?

NORA
They call nobody, because it lives in a document they already know how to open. When Google breaks, we have bigger problems than a screenplay.

MAN FROM IT
And security.

NORA
The scripts are already in that account. They have been for six years. We are not moving anything. We are giving up trying to move it.

The man from IT looks at Priya. Priya looks at the ceiling.

PRIYA
Put it in a paper.

NORA
I have put it in a paper.

PRIYA
Put it in a shorter paper.

INT. SEMINAR ROOM 306 - DAY

Freshly painted. Beige. The table is back, and it looks smaller in a bigger room.

TOBIAS stands in the doorway with a box under his arm, taking it in.

NORA appears behind him with two coffees.

NORA
They painted it.

TOBIAS
They painted it.

NORA
Is it worse?

TOBIAS
(after consideration)
It is exactly the same room with a different smell. Which is what an institution is.

He goes in and puts the box on the table.

NORA
What&#x27;s in the box?

TOBIAS
Thirty-one years of marginalia. I thought I would burn it. Then I thought that was theatrical.

He opens it. Scripts, hundreds, annotated in red.

TOBIAS (CONT&#x27;D)
Somebody should have these. Not for the notes. For the handwriting. Students should see that a person did it.

EXT. FIRE ESCAPE - DAY

ADAM and LEILA sit on the metal steps with coffees. She has a printout with red pen on it. His.

ADAM
You went through the whole thing.

LEILA
I went through the whole thing.

ADAM
Why?

LEILA
Because you&#x27;d have gone through mine.

He reads a note, frowns, laughs.

ADAM
&quot;Who is holding the knife in this sentence.&quot; What does that mean?

LEILA
It means I couldn&#x27;t tell who was doing the action. Fenn says it.

ADAM
Fenn says a lot of things.

LEILA
Fenn&#x27;s retiring.

Adam looks up.

ADAM
Since when?

LEILA
July. It&#x27;s not announced. My tutor told my flatmate.

Adam looks out over the car park, at the rain arriving from the west, as it does.

ADAM
Then he&#x27;s not going to read the finished one.

LEILA
So finish it faster.

INT. LECTURE THEATRE - DAY

Full, this time. A poster by the door: A CONVERSATION WITH TOBIAS FENN.

NORA is on stage with two chairs. TOBIAS in the other one, looking at the audience with visible suspicion.

NORA
You have been here thirty-one years.

TOBIAS
Thirty-one years and four months, but the four months were unpaid, so they do not count.

Laughter.

NORA
What has changed?

TOBIAS
The paper is whiter.

More laughter. He waits for it to finish.

TOBIAS (CONT&#x27;D)
And the students are better. That is the honest answer and nobody in my position is supposed to give it. They are better read, better travelled, and considerably braver than we were.

NORA
Then what is harder?

TOBIAS
Getting in.

The room quietens.

TOBIAS (CONT&#x27;D)
When I started, a person could arrive here from a village with one bus and no connections, and somebody would open a door because it cost them nothing to open it. Now everything costs something. The software costs something. The equipment costs something. The unpaid three months in London costs the most of all, and it is invisible in every prospectus we print.

Nora does not interrupt. Nobody does.

TOBIAS (CONT&#x27;D)
So when people ask me what I taught, I would like to say structure, or dialogue, or Chekhov. But I think what I actually did, on the good days, was hold a door.

INT. FOYER - LATER

Wine in plastic cups, a queue of people wanting a word. ADAM at the back of it, holding a script, losing his nerve.

The queue moves. He does not.

LEILA (O.S.)
Go.

She is behind him, and she pushes him in the small of the back, hard enough to be an event.

INT. FOYER - CONTINUOUS

Adam arrives in front of Tobias with nothing prepared.

ADAM
I finished it.

TOBIAS
Page four?

ADAM
All of it. Ninety-two pages.

Tobias holds out his hand. Adam gives him the script. Tobias weighs it, actually weighs it, in his palm.

TOBIAS
Heavy.

ADAM
Is that bad?

TOBIAS
It is a fact. Facts are neither.

He puts it under his arm with the box of thirty-one years.

TOBIAS (CONT&#x27;D)
I will read it in July, when I am no longer paid to, which is the only way to be sure that I am reading it.

INT. NORA&#x27;S OFFICE - NIGHT

Nora alone, the paper on screen, the cursor blinking after a heading: RECOMMENDATION.

She types one sentence, reads it, and for once does not delete it.

Insert: &quot;That we stop buying software our students cannot open, and start paying people to read what they write.&quot;

EXT. CAMPUS - NIGHT

The building with one window lit, high up, which is hers.

INT. SEMINAR ROOM 306 - NIGHT

TOBIAS alone with a new stack. The red pen is uncapped now. He works fast, the way a man works when he has decided something.

He stops at a page, reads it twice, and writes in the margin: &quot;YES.&quot;

He turns it over and keeps going.

EXT. HEADINGTON HILL - NIGHT

Rain again. Buses climb the hill with their lights on, full of people going home.

INT. NORA&#x27;S KITCHEN - NIGHT

Nora at a table with a laptop, a glass of wine, and a spreadsheet she is losing to. She types a number, deletes it, types a smaller one.

Her phone lights up: TOBIAS FENN.

NORA
(answering)
It&#x27;s eleven o&#x27;clock.

TOBIAS (V.O.)
It is eleven o&#x27;clock and I have a question about a telephone.

INT. SEMINAR ROOM 306 - CONTINUOUS - INTERCUT

Tobias, phone to his ear, the stack in front of him.

TOBIAS
If a woman lets a telephone ring three times on the page, how many times does it ring in the film?

NORA
Three.

TOBIAS
Wrong. It rings for as long as the editor can bear it, which is never three.

NORA
Then why write it three times?

TOBIAS
Because the writer has to feel it three times before anybody else feels it once.

Nora looks at her spreadsheet. She closes the laptop.

NORA
Tobias. Why are you calling me?

A pause on the line. The rain on his window is audible.

TOBIAS
Because I am going to stop in July, and I would like somebody to know what I know before I do.

INT. NORA&#x27;S KITCHEN - CONTINUOUS

Nora does not move.

NORA
Does the department know?

TOBIAS (V.O.)
The department will know in April, in an email, from somebody in an office who has never read a script.

NORA
That&#x27;s a terrible way to end thirty-one years.

TOBIAS (V.O.)
It is the standard way. I have seen it done to better people.

NORA
Then let&#x27;s do it differently.

TOBIAS (V.O.)
(amused)
With what? A ceremony?

NORA
With a class.

EXT. CAMPUS - DAY

Spring, or the idea of spring. Buds on the one tree. Students on the grass with coats still on, because it is England.

INT. SEMINAR ROOM 306 - DAY

The table has been pushed to the wall. Twenty chairs in a circle. ADAM sits with his script in his lap. Around him, STUDENTS, and NORA at the back, and TOBIAS in the middle with nothing in his hands.

TOBIAS
Today somebody reads out loud and everybody else keeps their opinion in their mouth until the end.

He looks at Adam. Adam does not move.

TOBIAS (CONT&#x27;D)
Mr Cheung. Page four.

ADAM
Out loud?

TOBIAS
That is what the page is for.

Adam stands, because he does not know you can read sitting down. His hands are not steady. He begins.

ADAM
(reading)
&quot;Interior. Flat. Night. She is at the sink with her back to the room. The telephone starts to ring.&quot;

He looks up. The room is looking at him. He looks back down.

ADAM (CONT&#x27;D)
(reading)
&quot;She lets it ring.&quot;

A beat.

ADAM (CONT&#x27;D)
(reading)
&quot;She lets it ring.&quot;

Another. Longer.

ADAM (CONT&#x27;D)
(reading)
&quot;She lets it ring.&quot;

Silence in the circle. Real silence, the kind you can hear a chair make.

A STUDENT
(quietly)
Is she going to answer it?

ADAM
No.

The student nods slowly, and something happens in the room that nobody will be able to describe in the bar afterwards.

TOBIAS
Thank you. Sit down before you enjoy it.

Adam sits. Nora, at the back, is not looking at Adam. She is looking at Tobias, and what she sees is a man watching a thing he made outlive him.

INT. CORRIDOR OUTSIDE 306 - LATER

Students file out. Adam is stopped by two others who want to say something and do not know how. He says it for them.

ADAM
It&#x27;s not finished.

STUDENT TWO
It&#x27;s better than finished.

They go. Adam stands alone in the corridor with the script against his chest.

INT. SEMINAR ROOM 306 - CONTINUOUS

Nora stacks chairs. Tobias does not help, which is his way of staying.

NORA
I have my number.

TOBIAS
For February.

NORA
For February. It is smaller than forty-one thousand and it does something else.

TOBIAS
Which is?

NORA
It buys the thing they already have. Whatever machine, whatever house. We stop asking them to move.

Tobias considers the stacked chairs.

TOBIAS
That is either very clever or the beginning of a long complaint from a man in an office.

NORA
Both.

TOBIAS
(pleased)
Both is correct.

EXT. OXFORD STREET - NIGHT

The wet street, shop lights, the last bus. Nora walks Tobias to the stop, slower than either of them needs to walk.

TOBIAS
You will have to teach it.

NORA
The software?

TOBIAS
The format. The software is a plumber. Somebody still has to know why the water goes where it goes.

NORA
I know why.

TOBIAS
Then say it to me now, so that I have heard you say it.

Nora stops walking. This matters more than she expected.

NORA
Because the page is a promise about time. A minute of a stranger&#x27;s life for every page, and if you lie about it, they find out in the dark, in a room, with their coat on their knees.

Tobias looks at her for a moment too long.

TOBIAS
Thirty-one years and nobody has put it that well.

NORA
You put it better in 1996. I read the article.

TOBIAS
(getting on the bus)
Then plagiarise me properly. Put my name on it.

The doors close. The bus pulls away up the hill. Nora stands in the rain longer than she needs to.

INT. SEMINAR ROOM 306 - NIGHT

Empty. The chairs are stacked. On the table, one thing: a red pen, capped, left deliberately in the middle where somebody will find it.

INT. ADAM&#x27;S ROOM - NIGHT

A small room, a desk made of a door, the old laptop open. On the screen, a document, and in it a scene that is finally in the right shape.

Adam reads it. He changes one word. He reads it again.

He types, at the bottom of the page, in capitals, the only part of a script anybody gets to write for themselves.

Insert: on the screen, the words &quot;THE END&quot;.

He looks at it. He deletes it.

ADAM
(to himself)
Not yet.

He scrolls back to the top and starts again at page one, which is what writers do, and which is the whole of this story.

EXT. HEADINGTON HILL - DAWN

The hill in first light. Rain gone. The road wet and shining. A fox crosses, unhurried, and is gone into the hedge.

The first bus of the day climbs the hill with its lights still on.

FADE OUT.
