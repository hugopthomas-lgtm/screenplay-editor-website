<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenplay Editor</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="engine.js?v=2.1.1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="taskpane.css?v=2.1.1">
</head>
<body>
  <div class="header">
    <div class="header-title">Screenplay<span class="brand-dot">.</span></div>
    <div class="header-sub">for Word</div>
  </div>

  <main class="screen">
    <div class="pill" id="pill"></div>

    <div class="rail-row">
      <div id="rail"></div>
      <div class="rail-labels" id="rail-labels"></div>
    </div>

    <div class="tools">
      <button class="tool" id="btn-format">
        <span class="flame"></span>
        <span class="tool-label">Format my document</span>
        <kbd id="kbd-format"></kbd>
      </button>
      <button class="tool" id="btn-pages">
        <span class="tool-icon">#</span>
        <span class="tool-label">Page numbers</span>
      </button>
      <div class="row">
        <label class="paper-label" for="paper">Paper</label>
        <select id="paper" class="paper">
          <option value="US">US Letter</option>
          <option value="A4">A4</option>
        </select>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <pre class="log" id="log"></pre>
  </main>

  <footer class="footer">
    <a href="https://screenplayeditor.app" target="_blank" rel="noopener">screenplayeditor.app</a>
    <span class="version" id="version">v2.1.1</span>
  </footer>

  <script type="module" src="taskpane.js?v=2.1.1"></script>
</body>
</html>
