<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenplay Editor</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="engine.js?v=5.5.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="panel.css?v=5.5.0">
  <link rel="stylesheet" href="word.css?v=5.5.0">
</head>
<body>
  <div class="screens-container">
  <div class="screen" id="screen-main">
  <div class="header" style="display:flex;align-items:center;justify-content:space-between;">
    <div class="header-title">scrrrr<span class="brand-dot">.</span></div>
    <div class="header-right" style="display:flex;align-items:center;gap:10px;">
      <span class="se-plan" id="se-plan">Pro</span>
      <button id="feedback-header-btn" data-se="feedback" title="Send feedback" style="background:none;border:none;cursor:pointer;padding:4px;color:#8e8e96;display:flex;align-items:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9h8"/><path d="M8 13h6"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z"/></svg>
      </button>
    </div>
  </div>
<!-- TAB BAR -->
  <div class="tab-bar se-tabs">
    <button class="tab-btn active" id="tab-btn-home" data-se="tab:home">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12.085 6.5l5.415 5.415l-8.793 8.792a1 1 0 0 1 -.707 .293h-4a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 .293 -.707zm5.406 -2.698a3.828 3.828 0 0 1 1.716 6.405l-.292 .293l-5.415 -5.415l.293 -.292a3.83 3.83 0 0 1 3.698 -.991"/></svg>
      <span id="tab-label-home">write</span>
    </button>
    <button class="tab-btn" id="tab-btn-studio" style="position:relative" data-se="tab:studio">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 2a1 1 0 0 1 0 2v4.826l3.932 10.814l.034 .077a1.7 1.7 0 0 1 -.002 1.193l-.07 .162a1.7 1.7 0 0 1 -1.213 .911l-.181 .017h-11l-.181 -.017a1.7 1.7 0 0 1 -1.285 -2.266l.039 -.09l3.927 -10.804v-4.823a1 1 0 1 1 0 -2h6zm-2 2h-2v4h2v-4z"/></svg>
      <span id="tab-label-studio">studio</span>
      <span class="craft-notif-dot" id="craft-notif-dot"></span>
    </button>
    <button class="tab-btn" id="tab-btn-export" data-se="tab:export">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M21.864 3.549l-6.454 17.868a1.55 1.55 0 0 1 -1.41 .903a1.54 1.54 0 0 1 -1.394 -.874l-2.88 -5.759zm-1.414 -1.414l-12.139 12.138l-5.728 -2.864a1.55 1.55 0 0 1 -.903 -1.409c0 -.606 .353 -1.157 .981 -1.44z"/></svg>
      <span id="tab-label-export">ship</span>
    </button>
  </div>

  

  

  
  <div class="tab-panels">

  <!-- ===== HOME PANEL ===== -->
  <div class="tab-panel active" id="panel-home">
    <div class="se-empty" id="se-empty" hidden><svg class="se-illu" width="132" height="104" viewBox="0 0 132 104" fill="none" stroke="#1f262e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-6 66 56)"><rect x="36" y="14" width="60" height="78" rx="6" fill="#fff"/><path d="M44 28h22"/><path d="M44 36h40M44 42h40M44 48h32"/><path d="M62 58h14"/><path d="M52 66h36M52 72h36M52 78h24"/></g>
  <path d="M104 22l2.2 5.6 5.6 2.2-5.6 2.2-2.2 5.6-2.2-5.6-5.6-2.2 5.6-2.2z" fill="#6f57ff" stroke="#6f57ff"/>
  <path d="M28 70l1.5 3.8 3.8 1.5-3.8 1.5-1.5 3.8-1.5-3.8-3.8-1.5 3.8-1.5z" fill="#e4ddff" stroke="#6f57ff"/>
  <path d="M112 44h6M115 41v6" stroke="#6f57ff"/>
</svg><div class="se-empty-title">A blank page. Good.</div><div class="se-empty-sub">Write <kbd class="se-key">INT.</kbd> to open your first scene. Enter and Tab do the rest.</div></div>
    <div class="se-voice" id="pill"><span class="se-voice-dot" id="pill-dot"></span><span id="pill-hints"></span></div>
    <div class="se-el-grid" id="rail">
      <button class="se-el" data-mode="SCENE_HEADING" title="Scene heading"><span class="se-el-ic"><svg class="se-duo" width="17" height="17" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="currentColor"><path d="M8.813 11.612c.457 -.38 .918 -.38 1.386 .011l.108 .098l4.986 4.986l.094 .083a1 1 0 0 0 1.403 -1.403l-.083 -.094l-1.292 -1.293l.292 -.293l.106 -.095c.457 -.38 .918 -.38 1.386 .011l.108 .098l4.674 4.675a4 4 0 0 1 -3.775 3.599l-.206 .005h-12a4 4 0 0 1 -3.98 -3.603l6.687 -6.69l.106 -.095zm9.187 -9.612a4 4 0 0 1 3.995 3.8l.005 .2v9.585l-3.293 -3.292l-.15 -.137c-1.256 -1.095 -2.85 -1.097 -4.096 -.017l-.154 .14l-.307 .306l-2.293 -2.292l-.15 -.137c-1.256 -1.095 -2.85 -1.097 -4.096 -.017l-.154 .14l-5.307 5.306v-9.585a4 4 0 0 1 3.8 -3.995l.2 -.005h12zm-2.99 5l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007z"/></g></svg></span><span class="se-el-lb">Scene heading</span></button>
      <button class="se-el" data-mode="ACTION" title="Action"><span class="se-el-ic"><svg class="se-duo" width="17" height="17" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/></svg><span class="se-skate se-skate-over"></span></span><span class="se-el-lb">Action</span></button>
      <button class="se-el" data-mode="CHARACTER" title="Character"><span class="se-el-ic"><svg class="se-duo" width="17" height="17" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="currentColor"><path d="M12 2a5 5 0 1 1 -5 5l.005 -.217a5 5 0 0 1 4.995 -4.783z"/><path d="M14 14a5 5 0 0 1 5 5v1a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-1a5 5 0 0 1 5 -5h4z"/></g></svg></span><span class="se-el-lb">Character</span></button>
      <button class="se-el" data-mode="DIALOGUE" title="Dialogue"><span class="se-el-ic"><svg class="se-duo" width="17" height="17" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17.802 17.292s.077 -.055 .2 -.149c1.843 -1.425 3 -3.49 3 -5.789c0 -4.286 -4.03 -7.764 -9 -7.764c-4.97 0 -9 3.478 -9 7.764c0 4.288 4.03 7.646 9 7.646c.424 0 1.12 -.028 2.088 -.084c1.262 .82 3.104 1.493 4.716 1.493c.499 0 .734 -.41 .414 -.828c-.486 -.596 -1.156 -1.551 -1.416 -2.29l-.002 .001"/><path d="M7.5 13.5c2.5 2.5 6.5 2.5 9 0"/></g></svg></span><span class="se-el-lb">Dialogue</span></button>
      <button class="se-el" data-mode="PARENTHETICAL" title="Parenthetical"><span class="se-el-ic"><svg class="se-duo" width="17" height="17" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4c-3.333 3.333 -3.333 12.667 0 16"/><path d="M17 4c3.333 3.333 3.333 12.667 0 16"/></g></svg></span><span class="se-el-lb">Parenthetical</span></button>
      <button class="se-el" data-mode="TRANSITION" title="Transition"><span class="se-el-ic"><svg class="se-duo" width="17" height="17" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l5 5l-5 5"/><path d="M13 7l5 5l-5 5"/></g></svg></span><span class="se-el-lb">Transition</span></button>
      </div>

    <button class="se-primary" id="format-doc-btn" data-se="format"><img src="assets/flame.png" alt="" class="se-flame"><span>Format my document</span></button>

    <div class="se-label">Page</div>
    <div class="se-list">
      <button class="se-row" id="btn-title-page" data-se="titlepage"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 17h6M9 13h6"/></g></svg><span class="se-row-lb">Title page</span><svg class="se-i se-row-end" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="se-titlepage" id="se-titlepage" hidden>
        <input class="se-input" id="tp-title" placeholder="Title">
        <input class="se-input" id="tp-author" placeholder="Written by">
        <input class="se-input" id="tp-contact" placeholder="Contact (bottom left)">
        <div class="se-titlepage-actions">
          <button class="se-btn" data-se="titlepage-cancel">Cancel</button>
          <button class="se-btn se-btn-dark" data-se="titlepage-insert">Insert title page</button>
        </div>
      </div>
      <div class="se-row" id="btn-scene-numbers"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M11 4L7 20M17 4l-4 16"/></g></svg><span class="se-row-lb">Scene numbers</span><span class="se-row-end se-minis"><button class="se-mini" data-se="sn-add" title="Add scene numbers"><svg class="se-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="se-mini" data-se="sn-remove" title="Remove scene numbers"><svg class="se-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button></span></div>
      <button class="se-row" id="btn-pages" data-se="pages"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 9h1M9 13h6M9 17h6"/></g></svg><span class="se-row-lb">Page numbers</span><svg class="se-i se-row-end" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="se-row" title="Paper size"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></g></svg><span class="se-row-lb">Paper</span><span class="se-row-end se-switch"><button class="se-paper-opt" data-paper="US" data-se="paper" title="US Letter">Letter</button><button class="se-paper-opt" data-paper="A4" data-se="paper" title="A4">A4</button></span></div>
    </div>

    <input type="file" id="import-file-input" accept=".fountain,.txt,.fdx" style="display:none;">
    <div class="se-list se-list-import">
      <button class="se-row" id="import-home-btn" data-se="import"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v12"/></g></svg><span class="se-row-lb">Import a screenplay<span class="se-row-sub">Fade In · Final Draft · PDF · Fountain</span></span><svg class="se-i se-row-end" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="tab-panel" id="panel-studio">
    <div class="se-list">
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4"/></g></svg><span class="se-row-lb">ElevenLabs Table Read<span class="se-row-sub">A different voice for each character. Hear your whole script read out loud.</span></span><span class="se-soon">soon</span></button>
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></g></svg><span class="se-row-lb">Scene Board<span class="se-row-sub">Every scene on a card. Drag, drop, restructure. Your script updates itself.</span></span><span class="se-soon">soon</span></button>
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="6" height="8" rx="1"/><rect x="9" y="8" width="6" height="12" rx="1"/><rect x="15" y="4" width="6" height="16" rx="1"/><path d="M4 20h14"/></g></svg><span class="se-row-lb">Script Stats<span class="se-row-sub">Industry-standard reports. Characters, scenes, locations, page-by-page metrics.</span></span><span class="se-soon">soon</span></button>
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M16 4v16M4 8h4M4 16h4M4 12h16M16 8h4M16 16h4"/></g></svg><span class="se-row-lb">Screenplay Poster<span class="se-row-sub">See your script as a movie poster. Pick a style, get a real-looking film poster in 30s.</span></span><span class="se-soon">soon</span></button>
    </div>
  </div>
  <div class="tab-panel" id="panel-export">
    <div class="se-list">
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 10h18M10 3v18M16 19h6M19 16l3 3-3 3"/></g></svg><span class="se-row-lb">Production Breakdown<span class="se-row-sub">Scene-by-scene breakdown. Cast, props, wardrobe, SFX, everything.</span></span><span class="se-soon">soon</span></button>
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19a9 9 0 0 1 9 0 9 9 0 0 1 9 0M3 6a9 9 0 0 1 9 0 9 9 0 0 1 9 0M3 6v13M12 6v13M21 6v13"/></g></svg><span class="se-row-lb">Print View<span class="se-row-sub">Real pages, real layout, before you hit export.</span></span><span class="se-soon">soon</span></button>
    </div>
    <div class="se-label">Export</div>
    <div class="se-list">
      <button class="se-row" data-se="export-pdf"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12V5a2 2 0 0 1 2-2h7l5 5v4M5 18h1.5a1.5 1.5 0 0 0 0-3H5v6M17 18h2M20 15h-3v6M11 15v6h1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-1z"/></g></svg><span class="se-row-lb">PDF<span class="se-row-sub">File › Save a Copy › PDF. Your styles carry over.</span></span><svg class="se-i se-row-end" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="se-row" data-se="export-fountain"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 9h1M9 13h6M9 17h6"/></g></svg><span class="se-row-lb">Fountain<span class="se-row-sub">Plain text with the screenplay markers, copied to your clipboard.</span></span><svg class="se-i se-row-end" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="se-row" data-se="soon"><svg class="se-duo" width="18" height="18" viewBox="0 0 28 28"><circle cx="16" cy="16" r="9.5" fill="var(--duo)"/><g transform="translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M11.5 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v5M13.5 20a2 2 0 0 0 2 2M21 16l-3 3 3 3M18 19h-3.5"/></g></svg><span class="se-row-lb">Final Draft (.fdx)<span class="se-row-sub">Open your script in Final Draft.</span></span><span class="se-soon">soon</span></button>
    </div>
  </div>
  </div>
  </div><!-- /screen-main -->
  <div class="tab-panels-footer">
    <!-- Fincher 42 — Words/Characters dans le footer, juste au-dessus de Preferences -->
    <div class="focus-stats-bar" id="focus-stats-bar">
      <div class="focus-stat">
        <div class="focus-stat-value" id="focus-stat-words">-</div>
        <div class="focus-stat-label" id="focus-stat-words-label">Words</div>
      </div>
      <div class="focus-stat-divider"></div>
      <div class="focus-stat">
        <div class="focus-stat-value" id="focus-stat-chars">-</div>
        <div class="focus-stat-label" id="focus-stat-chars-label">Characters</div>
      </div>
      <button class="focus-stats-refresh" id="focus-stats-refresh" title="Refresh" data-se="stats">
        <i class="ti ti-refresh"></i>
      </button>
    </div>
    <div class="tab-panels-footer-actions">
